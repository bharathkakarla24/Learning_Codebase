<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-commerce Website</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100">
    <header class="bg-white shadow">
        <div class="container mx-auto flex justify-between items-center p-4">
            <h1 class="text-2xl font-bold">E-Shop</h1>
            <nav>
                <ul class="flex space-x-4">
                    <li><a href="#" class="text-gray-700 hover:text-blue-500">Home</a></li>
                    <li><a href="#" class="text-gray-700 hover:text-blue-500">Products</a></li>
                    <li><a href="#" class="text-gray-700 hover:text-blue-500">Cart</a></li>
                    <li><a href="#" class="text-gray-700 hover:text-blue-500">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>
    <main class="container mx-auto mt-8">
        <section class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <!-- Example Product -->
            <div class="bg-white p-4 shadow rounded-lg">
                <img src="https://via.placeholder.com/150" alt="Product Image" class="w-full h-40 object-cover rounded-t-lg">
                <div class="mt-4">
                    <h2 class="text-lg font-bold">Product Name</h2>
                    <p class="text-gray-600 mt-2">$19.99</p>
                    <button class="bg-blue-500 text-white px-4 py-2 mt-4 rounded hover:bg-blue-600">Add to Cart</button>
                </div>
            </div>
            <!-- Add more products similarly -->
        </section>
    </main>
    <footer class="bg-gray-800 text-white mt-8">
        <div class="container mx-auto p-4 text-center">
            <p>&copy; 2025 E-Shop. All Rights Reserved.</p>
        </div>
    </footer>
</body>
</html>
